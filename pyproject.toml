[project]
name = "policydesk"
version = "0.1.0"
description = "A learning-grade agentic RAG system over expense policy documents and spend data."
requires-python = ">=3.12,<3.13"

# Versions below are PINNED to what actually resolved on 2026-10-04,
# not remembered. Re-resolve deliberately, never accidentally.
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = import sorting, UP = modern syntax,
# B = likely bugs, SIM = simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]
