[project]
name = "policydesk"
version = "0.1.0"
description = "A learning-grade agentic RAG system over expense policy documents and spend data."
requires-python = ">=3.12,<3.13"

# Versions below are PINNED to what actually resolved on 2026-10-04,
# not remembered. Re-resolve deliberately, never accidentally.
dependencies = [
    # Milestone 0: configuration, validation, logging
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "structlog==26.1.0",
    # Milestone 1: generating and reading documents
    "reportlab==5.0.1",   # writes the sample policy PDFs
    "openpyxl==3.1.5",    # reads and writes .xlsx
    "pdfplumber==0.11.10",  # per-page PDF text and table extraction
    "pypdf==6.19.0",      # PDF page-level utilities
    "pillow==12.3.0",     # renders the image-only "scanned" page
    # Milestone 2: embeddings, vector search, chunking
    "openai==3.24.0",                    # the official API client
    "tiktoken==0.14.0",                  # count tokens locally, before paying
    "chromadb==1.5.9",                   # local vector store
    "langchain-text-splitters==1.1.3",   # the recursive character splitter
    # Milestone 4: the agent graph
    "langgraph==1.2.12",                      # state machine with cycles + interrupts
    "langgraph-checkpoint-sqlite==3.1.1",     # durable pauses, so approval can wait
    # Milestone 6: Model Context Protocol. Pinned because 2.x renamed FastMCP to
    # MCPServer and inputSchema to input_schema - writing either from memory breaks.
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = import sorting, UP = modern syntax,
# B = likely bugs, SIM = simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]
