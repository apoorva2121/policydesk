# CI: the checks that must pass before a change is trusted.
#
# The guiding rule: CI runs with NO API KEY. Every test in this project uses a
# fake model client, so the suite is free, fast and deterministic. A test suite
# that needs a paid key is a suite that gets skipped the week the key expires.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # No OPENAI_API_KEY here, deliberately. APP_ENV=test makes the settings
      # validator skip the credential check, which is the whole reason that
      # escape hatch exists.
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the project and dev tools
        run: |
          uv venv --python 3.12
          uv pip install -e .
          uv pip install pytest ruff

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Verify a clean install works from pyproject alone
        # Guards the README's setup instructions. A tutorial that will not install
        # is worthless, and this is the only way to know the manifest is complete.
        run: |
          uv venv --python 3.12 /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install .
          /tmp/fresh/bin/python -c "import policydesk; print('imports cleanly:', policydesk.__version__)"

      - name: Verify the sample data generates and extracts
        # An end-to-end check that needs no API key: generate the corpus, extract
        # it, and confirm the chunker produces chunks.
        run: |
          uv run python -m policydesk.cli generate-data
          uv run python -m policydesk.cli extract --show 0
          uv run python -m policydesk.cli chunks --show 0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Build only. Running it would need a key, and a CI job that needs a
        # secret cannot run on a fork's pull request.
        run: docker build -t policydesk:ci .
